<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Esahp — Link Portal</title>
<meta name="theme-color" content="#14100C" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="spotlight" aria-hidden="true"></div>
    <div class="embers" id="embers" aria-hidden="true"></div>

    <main class="content">
      <section class="hero">
        <div class="avatar in" id="avatar">
          <div class="glow" aria-hidden="true"></div>
          <div class="ring" aria-hidden="true"></div>
          <div class="avatar-face" id="avatar-face">
            <!-- The cat's behaviour (eye tracking, blinks, ear twitches, moods)
                 is driven by the cat section of app.js via classes on .cat. -->
            <svg class="cat" id="cat" width="80" height="80" viewBox="0 0 100 100" role="img" aria-label="แมวดำ อวาตาร์">
              <g class="head">
                <!-- Ear bases sit inside the head ellipse so the ears grow out
                     of it; the mockup's (18,30)/(82,30) corners poked out past
                     the head's edge and made the ears look stuck on. -->
                <g class="ear ear-l">
                  <path d="M17 40 L27 6 L46 26 Z" fill="#0B0806"></path>
                  <path d="M23 33 L28.5 15 L39 27 Z" fill="#2A1710"></path>
                </g>
                <g class="ear ear-r">
                  <path d="M83 40 L73 6 L54 26 Z" fill="#0B0806"></path>
                  <path d="M77 33 L71.5 15 L61 27 Z" fill="#2A1710"></path>
                </g>
                <ellipse cx="50" cy="56" rx="38" ry="34" fill="#0B0806"></ellipse>

                <g class="whiskers whiskers-l" stroke="#4A3A30" stroke-width="0.9" stroke-linecap="round" fill="none">
                  <path d="M30 64 Q18 62 6 60"></path>
                  <path d="M30 67 Q18 68 7 70"></path>
                </g>
                <g class="whiskers whiskers-r" stroke="#4A3A30" stroke-width="0.9" stroke-linecap="round" fill="none">
                  <path d="M70 64 Q82 62 94 60"></path>
                  <path d="M70 67 Q82 68 93 70"></path>
                </g>

                <ellipse class="blush" cx="26" cy="64" rx="4.5" ry="2.4"></ellipse>
                <ellipse class="blush" cx="74" cy="64" rx="4.5" ry="2.4"></ellipse>

                <g class="eyes">
                  <g class="eye">
                    <ellipse cx="35" cy="54" rx="7" ry="8" fill="var(--cat-eye)"></ellipse>
                    <g class="pupil"><rect class="slit" x="33.5" y="48" width="3" height="12" rx="1.5" fill="#0B0806"></rect></g>
                    <circle cx="37.6" cy="50.6" r="1.4" fill="#FFF3E6" opacity="0.9"></circle>
                  </g>
                  <g class="eye">
                    <ellipse cx="65" cy="54" rx="7" ry="8" fill="var(--cat-eye)"></ellipse>
                    <g class="pupil"><rect class="slit" x="63.5" y="48" width="3" height="12" rx="1.5" fill="#0B0806"></rect></g>
                    <circle cx="67.6" cy="50.6" r="1.4" fill="#FFF3E6" opacity="0.9"></circle>
                  </g>
                </g>
                <!-- ^ ^ eyes, swapped in while the cat is happy -->
                <g class="happy-eyes" stroke="var(--cat-eye)" stroke-width="3" stroke-linecap="round" fill="none">
                  <path d="M29 56 Q35 48 41 56"></path>
                  <path d="M59 56 Q65 48 71 56"></path>
                </g>

                <path d="M47.6 62.4 L52.4 62.4 L50 65 Z" fill="#6A3A2C"></path>
                <path class="mouth" d="M45.5 66.5 Q47.8 69.2 50 66.5 Q52.2 69.2 54.5 66.5" stroke="#4A3026" stroke-width="1.2" stroke-linecap="round" fill="none"></path>
              </g>
            </svg>
          </div>
        </div>
        <h1 class="ttl in" id="name">Esahp<span class="dot">.</span></h1>
      </section>

      <nav class="links" id="links" aria-label="ลิงก์"></nav>

      <footer class="in" id="footer">© 2026 Esahp</footer>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
